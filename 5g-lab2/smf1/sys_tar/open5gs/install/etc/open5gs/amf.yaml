logger:
    file: /open5gs/install/var/log/open5gs/amf.log

sbi:
    server:
      no_tls: true
    client:
      no_tls: true

parameter:

amf:
    sbi:
      - addr: 172.22.0.10
        port: 7777
    ngap:
      - addr: 172.22.0.10
    guami:
      - plmn_id:
          mcc: 001
          mnc: 01
        amf_id:
          region: 2
          set: 1
    tai:
      - plmn_id:
          mcc: 001
          mnc: 01
        tac: 100
    plmn_support:
      - plmn_id:
          mcc: 001
          mnc: 01
        s_nssai:
          - sst: 1
            sd: 000001
          - sst: 1
            sd: 000002
    security:
        integrity_order : [ NIA0, NIA1, NIA2 ]
        ciphering_order : [ NEA0, NEA1, NEA2 ]
    network_name:
        full: Open5GS
    amf_name: open5gs-amf0
    metrics:
      - addr: 172.22.0.10
        port: 9091

scp:
    sbi:
      - addr:
          - 172.22.0.35
        port: 7777

nrf:
    sbi:
      - addr:
          - 172.22.0.12
        port: 7777

time:
  t3512:
    value: 6000
