logger:
    file:
      path: /open5gs/install/var/log/open5gs/smf.log

sbi:
    server:
      no_tls: true
    client:
      no_tls: true

global:
  max:
    ue: 1024
  parameter:
      no_ipv4v6_local_addr_in_packet_filter: true

smf:
    freeDiameter: /open5gs/install/etc/freeDiameter/smf.conf
    sbi:
      server:
        - address: 172.22.0.7
          port: 7777
      client:
        nrf:
          - uri: http://172.22.0.12:7777
        scp:
          - uri: http://172.22.0.35:7777
    gtpc:
      server:
        - address: 172.22.0.7
    gtpu:
      server:
        - address: 172.22.0.7
    pfcp:
      server:
        - address: 172.22.0.7
      client:
        upf:
          - address: 172.22.0.8
    session:
      - subnet: 192.168.100.0/24
        gateway: 192.168.100.1
        dnn: internet
        dev: ogstun
      - subnet: 2001:230:cafe::/48
        gateway: 2001:230:cafe::1
        dnn: internet
        dev: ogstun
      - subnet: 192.168.101.0/24
        gateway: 192.168.101.1
        dnn: ims
        dev: ogstun2
      - subnet: 2001:230:babe::/48
        gateway: 2001:230:babe::1
        dnn: ims
        dev: ogstun2
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 2001:4860:4860::8888
      - 2001:4860:4860::8844
    p-cscf:
      - 172.22.0.21
    mtu: 1450
    metrics:
      server:
        - address: 172.22.0.7
          port: 9091
