logger:
    file:
      path: /open5gs/install/var/log/open5gs/nrf.log

sbi:
    server:
      no_tls: true
    client:
      no_tls: true

global:
  max:
    ue: 1024

nrf:
    serving:  # 5G roaming requires PLMN in NRF
      - plmn_id:
          mcc: 001
          mnc: 01
    sbi:
      server:
      - address: 172.22.0.12
        port: 7777
